<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vite App</title>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <link rel="stylesheet" href="./src/output.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
     integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
     crossorigin=""/>
</head>

<body class="bg-[#f7f7f7]">
  <div class="main-container w-[95%] m-auto h-screen">
    <div class="notification bg-black fixed top-10 transition-all duration-500 capitalize -right-full rounded-lg py-1 px-2 z-50 text-white ring-slate-950 shadow-lg ring-1 backdrop-blur-xl">
      Product added to cart
    </div>
    <header>

      <nav class="relative">
        <div class="login-options-section bg-[#2a2c30] p-3 flex  gap-4 md:gap-0 flex-col md:flex-row justify-between">
          <p class="text-white md:text-start text-center">Free shipping, 30-day return or refund guarantee.</p>
          <div class="navBtns text-blue-500 flex justify-center md:justify-normal gap-5">
            <a href="#">SIGN IN</a>
            <a href="#">SIGN UP</a>
          </div>
        </div>
        <div class="mobile-nav justify-center text-center hidden  absolute w-full h-screen z-50 bg-black">
          <ul class="gap-10 cursor-pointer text-white  font-semibold flex flex-col mx-3 py-14 text-xl">
            <span class="closeBtn absolute right-6 top-4 text-3xl material-symbols-outlined">
              close
              </span>
            <li class="hover:text-[#646cff] transition-all duration-300 relative"><a class="hover:after:w-[100%] after:transition-all after:duration-300 after:w-0 after:h-[1px] after:absolute after:bottom-0 after:left-0 after:bg-[#646cff]" href="/">HOME</a></li>
            <li class="hover:text-[#646cff] transition-all duration-300 relative"><a class="hover:after:w-[100%] after:transition-all after:duration-300 after:w-0 after:h-[1px] after:absolute after:bottom-0 after:left-0 after:bg-[#646cff]" href="./about.html">ABOUT</a></li>
            <li class="hover:text-[#646cff] transition-all duration-300 relative"><a class="hover:after:w-[100%] after:transition-all after:duration-300 after:w-0 after:h-[1px] after:absolute after:bottom-0 after:left-0 after:bg-[#646cff]" href="./products.html">PRODUCTS</a></li>
            <li class="hover:text-[#646cff] transition-all duration-300 relative"><a class="hover:after:w-[100%] after:transition-all after:duration-300 after:w-0 after:h-[1px] after:absolute after:bottom-0 after:left-0 after:bg-[#646cff]" href="./contact.html">CONTACT</a></li>
            <li class="bg-[#2a2c30] px-3 rounded-lg text-white  ">
              <a href="./checkout.html" class="flex items-center text-3xl justify-center">
                <span
                class="text-3xl material-symbols-outlined">
                shopping_cart
              </span>
              <span class="cartValue">0</span>
            </a>
              </li>
              
          </ul>
        </div>
        <div class="main-navbar flex md:flex-row flex-col  gap-4 md:gap-0  justify-between py-3 px-2 items-center">
          <div class="w-full flex items-center sm:justify-center justify-between md:justify-normal">
            <img class="w-36 h-12" src="./src/images/mynewlogo (1).png" alt="">
            <span  class="menu material-symbols-outlined sm:hidden block">
              menu
              </span>
          </div>
          <ul class="gap-4 cursor-pointer font-semibold hidden sm:flex">
            <li class="hover:text-[#646cff] transition-all duration-300 relative"><a class="hover:after:w-[100%] after:transition-all after:duration-300 after:w-0 after:h-[1px] after:absolute after:bottom-0 after:left-0 after:bg-[#646cff]" href="/">HOME</a></li>
            <li class="hover:text-[#646cff] transition-all duration-300 relative"><a class="hover:after:w-[100%] after:transition-all after:duration-300 after:w-0 after:h-[1px] after:absolute after:bottom-0 after:left-0 after:bg-[#646cff]" href="./about.html">ABOUT</a></li>
            <li class="hover:text-[#646cff] transition-all duration-300 relative"><a class="hover:after:w-[100%] after:transition-all after:duration-300 after:w-0 after:h-[1px] after:absolute after:bottom-0 after:left-0 after:bg-[#646cff]" href="./products.html">PRODUCTS</a></li>
            <li class="hover:text-[#646cff] transition-all duration-300 relative"><a class="hover:after:w-[100%] after:transition-all after:duration-300 after:w-0 after:h-[1px] after:absolute after:bottom-0 after:left-0 after:bg-[#646cff]" href="./contact.html">CONTACT</a></li>
            <li class="bg-[#2a2c30] px-3 rounded-lg text-white ">
              <a href="./checkout.html" class="flex items-center">
                <span
                class="material-symbols-outlined text-lg">
                shopping_cart
              </span>
              <span class="cartValue">0</span>
            </a>
              </li>
              
          </ul>
        </div>
      </nav>
    </header>
    <main class="my-10">
      <div class="contact-us">
        <h3 class="text-3xl font-bold mb-3">contact us</h3>
        <p>Get in touch with us. We are always here to help you.</p>
      </div>
      <div class="flex py-20 sm:flex-row flex-col-reverse">
        <div class="form-container w-full sm:w-[70%] flex">
          <form action="#" class="w-full  sm:w-[80%] flex flex-col gap-7">
            <div class="flex flex-col">  
              <label for="name" class="capitalize">Full Name</label>
              <input id="name" type="text" placeholder="Enter Full Name" class="w-[100%] py-2 border-[1px] border-black rounded-sm px-3">
            </div>

            <div class="flex flex-col">
              <label for="email" class="capitalize">email address</label>
              <input id="email" type="text" placeholder="ABC@gmail.com" class="w-[100%] py-2 border-[1px] border-black rounded-sm px-3">
            </div>

            <div class="flex flex-col">
              <label for="subject" class="capitalize">subject</label>
              <input id="subject" type="text" placeholder="Title of Your Message" class="w-[100%] py-2 border-[1px] border-black rounded-sm px-3">
            </div>

            <div class="flex flex-col">
              <label for="Message" class="capitalize">Message</label>
              <textarea name="Message" id="Message" placeholder="We are Always here to help you" class="w-[100%] py-2 border-[1px] border-black rounded-sm px-3 h-40 capitalize"></textarea>
            </div>
            <div>
              <button type="submit" class="bg-[#2a2c30] text-white py-2 px-4 rounded-lg text-sm">Send Message</button>
            </div>

          </form>
        </div>
        <div class="h-[250px] sm:h-[500px] w-full sm:mb-0 mb-6 sm:w-[60%] z-20" id="map"></div>
      </div>
      </main>
</div>
    
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
     integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
     crossorigin=""></script>
    <script src="./map.js"></script>
</body>

</html>
